<body>
<div id="stage">
  <canvas id="bg-canvas" width="640" height="360"></canvas>
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <!-- 타이틀 -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <div class="title-sub">대피소 번호를 찾을 수 없습니다</div>
      <h1 class="logo"><span class="l1">BUNKER</span> <span class="l2">404</span></h1>
      <div class="logo-kr">건 스 미 스</div>
      <p class="title-tag">고물을 주워 총을 만들고, 총으로 문을 지켜라.</p>
      <div class="title-btns" id="title-btns"></div>
      <div class="title-foot">마우스: 조준·사격 &nbsp;|&nbsp; 우클릭·Space: 수류탄 &nbsp;|&nbsp; R: 재장전 &nbsp;|&nbsp; 1·2·Q: 무기 교체 &nbsp;|&nbsp; ESC: 일시정지</div>
    </div>
  </section>

  <!-- 기지 (낮) -->
  <section id="screen-base" class="screen hidden">
    <header id="topbar"></header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <aside id="night"></aside>
  </section>

  <div id="pause" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
  <div id="toasts"></div>
  <div id="scan"></div>
</div>
